# Lumera Next: מסך ספסל אחד, שלב 1 (חומרה + מסך מקשים בסיסי). בלי צריבה עד אישור.
# חומרה (פינים, טיימינג, פרוטוקול STC) נלקחה מהידע של גיא (home-eyal, קריאה בלבד).
substitutions:
  name: lumera-c15
  friendly_name: "Lumera 15 סוויטת הורים"

esphome:
  name: ${name}
  project:
    name: lumera.next
    version: "0.1.0"
  friendly_name: ${friendly_name}
  name_add_mac_suffix: false

esp32:
  board: esp32-s3-devkitc-1
  flash_size: 16MB
  cpu_frequency: 240MHz
  framework:
    type: esp-idf
    advanced:
      loop_task_stack_size: 16384
    sdkconfig_options:
      CONFIG_SPIRAM_USE_MALLOC: y
      CONFIG_SPIRAM_MALLOC_ALWAYSINTERNAL: "4096"
      CONFIG_SPIRAM_TRY_ALLOCATE_WIFI_LWIP: n
      CONFIG_COMPILER_OPTIMIZATION_PERF: y
      CONFIG_ESP32S3_DATA_CACHE_LINE_64B: y
      CONFIG_SPIRAM_FETCH_INSTRUCTIONS: y
      CONFIG_SPIRAM_RODATA: y
      CONFIG_LCD_RGB_RESTART_IN_VSYNC: y
      CONFIG_LCD_RGB_ISR_IRAM_SAFE: y
      CONFIG_ESP32S3_DATA_CACHE_64KB: y
      CONFIG_ESP32S3_INSTRUCTION_CACHE_32KB: y

psram:
  mode: octal
  speed: 80MHz

logger:
  baud_rate: 115200
  hardware_uart: UART0
  level: INFO

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "Lumera C15 Setup"
    password: !secret l10_ap_password

api:
  encryption:
    key: !secret l10_api_key
  reboot_timeout: 0s   # מקומי קודם: מסך ממשיך לעבוד גם בלי HA

ota:
  - platform: esphome
    password: !secret l10_ota_password

web_server:
  port: 80
  auth:
    username: lumera
    password: !secret l10_web_password

i2c:
  id: bus_a
  sda: GPIO8
  scl: GPIO18
  frequency: 100kHz   # ב-300kHz קריאת STC נכשלת (גיא)
  timeout: 13ms
  scan: true

i2c_device:
  id: stc
  address: 0x20

packages:
  ui: !include generated/ui.yaml   # עיצוב: נוצר מ-design/ (tools/gen_firmware.py)

globals:
  - id: relay_bits
    type: uint8_t[4]
    initial_value: '{0, 0, 0, 0}'

script:
  - id: stc_relays_write   # 25 01 r1 r2 r3 r4
    mode: queued
    then:
      - lambda: |-
          const uint8_t cmd[6] = {0x25, 0x01, id(relay_bits)[0], id(relay_bits)[1], id(relay_bits)[2], id(relay_bits)[3]};
          id(stc).write(cmd, 6);

switch:
  - platform: template
    id: relay1
    name: "Relay 1"
    optimistic: true
    on_turn_on:  [lambda: 'id(relay_bits)[0] = 1;', script.execute: stc_relays_write, script.execute: ui_key1_on]
    on_turn_off: [lambda: 'id(relay_bits)[0] = 0;', script.execute: stc_relays_write, script.execute: ui_key1_off]
  - platform: template
    id: relay2
    name: "Relay 2"
    optimistic: true
    on_turn_on:  [lambda: 'id(relay_bits)[1] = 1;', script.execute: stc_relays_write, script.execute: ui_key2_on]
    on_turn_off: [lambda: 'id(relay_bits)[1] = 0;', script.execute: stc_relays_write, script.execute: ui_key2_off]
  - platform: template
    id: relay3
    name: "Relay 3"
    optimistic: true
    on_turn_on:  [lambda: 'id(relay_bits)[2] = 1;', script.execute: stc_relays_write, script.execute: ui_key3_on]
    on_turn_off: [lambda: 'id(relay_bits)[2] = 0;', script.execute: stc_relays_write, script.execute: ui_key3_off]
  - platform: template
    id: relay4
    name: "Relay 4"
    optimistic: true
    on_turn_on:  [lambda: 'id(relay_bits)[3] = 1;', script.execute: stc_relays_write, script.execute: ui_key4_on]
    on_turn_off: [lambda: 'id(relay_bits)[3] = 0;', script.execute: stc_relays_write, script.execute: ui_key4_off]

display:
  - platform: rpi_dpi_rgb
    id: lcd
    dimensions:
      width: 480
      height: 854
    color_order: RGB
    pclk_frequency: 14MHz
    pclk_inverted: false
    de_pin:
      number: GPIO0
      ignore_strapping_warning: true
    hsync_pin:
      number: GPIO46
      ignore_strapping_warning: true
    vsync_pin:
      number: GPIO3
      ignore_strapping_warning: true
    pclk_pin: GPIO9
    hsync_pulse_width: 40
    hsync_back_porch: 30
    hsync_front_porch: 10
    vsync_pulse_width: 5
    vsync_back_porch: 20
    vsync_front_porch: 10
    data_pins:
      blue: [GPIO40, GPIO41, GPIO42, GPIO2, GPIO1]
      green: [GPIO13, GPIO12, GPIO11, GPIO10, GPIO38, GPIO39]
      red: [GPIO45, GPIO48, GPIO47, GPIO21, GPIO14]
    auto_clear_enabled: false
    update_interval: never

touchscreen:
  - platform: ft5x06
    id: touch
    address: 0x38
    transform:
      mirror_x: true
      mirror_y: true

