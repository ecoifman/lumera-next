- id: ui_refresh
  then:
  - if:
      condition:
        lambda: return id(theme_sel).current_option() == "navy";
      then:
      - script.execute: ui_theme_navy
  - if:
      condition:
        lambda: return id(theme_sel).current_option() == "black";
      then:
      - script.execute: ui_theme_black
  - if:
      condition:
        lambda: return id(theme_sel).current_option() == "white";
      then:
      - script.execute: ui_theme_white
  - if:
      condition:
        lambda: return id(theme_sel).current_option() == "lunar";
      then:
      - script.execute: ui_theme_lunar
  - if:
      condition:
        lambda: return id(theme_sel).current_option() == "hud";
      then:
      - script.execute: ui_theme_hud
  - if:
      condition:
        lambda: return id(theme_sel).current_option() == "ladder";
      then:
      - script.execute: ui_theme_ladder
