    priority: -100
    then:
    - script.execute: ui_refresh
select:
- platform: template
  id: theme_sel
  name: ערכת נושא
  options:
  - navy
  - black
  - white
  - lunar
  - hud
  - ladder
  initial_option: navy
  optimistic: true
  restore_value: true
  on_value:
  - script.execute: ui_refresh
globals:
- id: lon3
  type: bool
  initial_value: 'false'
- id: lon4
